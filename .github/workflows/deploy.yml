# On every push to master: run the tests, build the prod images (amd64 + arm64) and push them
# to GHCR, then deploy to the home server over Tailscale + SSH.
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET   Tailscale OAuth credential (Trust credentials → Credential → OAuth; Auth Keys write, tag:ci)
#   DEPLOY_HOST                            Server's Tailscale name or 100.x address
#   DEPLOY_USER                            SSH user on the server
#   DEPLOY_SSH_KEY                         Private key for that user (the public key goes in ~/.ssh/authorized_keys)
#   DEPLOY_KNOWN_HOSTS                     Output of: ssh-keyscan <DEPLOY_HOST>
#   DEPLOY_PATH                            Folder holding docker-compose.prod.yml and .env (e.g. /home/kurt/homeapp-prod)

name: Test, build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one to finish
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build dev images
        run: HomeAppDocker/build.sh dev

      - name: Run PHPUnit
        working-directory: HomeAppDocker
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: docker compose -p homeapp-ci -f docker-compose.ci.yml run --rm tests

      - name: Show service logs on failure
        if: failure()
        working-directory: HomeAppDocker
        run: docker compose -p homeapp-ci -f docker-compose.ci.yml logs --tail 100

      - name: Clean up
        if: always()
        working-directory: HomeAppDocker
        run: docker compose -p homeapp-ci -f docker-compose.ci.yml down -v

  build:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out registry and tag
        id: vars
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The server is ARM; this lets the amd64 runner build arm64 images (slower, but works on private repos)
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v6
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
          CACHE: gha
          COMPOSER_AUTH_JSON: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        with:
          source: .
          workdir: HomeAppDocker
          files: docker-bake.hcl
          targets: prod
          push: true
          set: |
            php-app.secrets=id=composer_auth,env=COMPOSER_AUTH_JSON

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: HomeAppDocker/docker-compose.prod.yml
          sparse-checkout-cone-mode: false

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull and start the new images
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Keep the server's compose file in step with the repo (.env and app.env stay as they are)
          scp -i ~/.ssh/id_deploy HomeAppDocker/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.prod.yml"

          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "TAG='$TAG' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Record the deployed tag in .env, so a manual `docker compose up` later uses the same images
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/" .env
          else
            echo "IMAGE_TAG=$TAG" >> .env
          fi

          docker compose -f docker-compose.prod.yml pull
          # --wait fails the deploy if any container doesn't become healthy/running
          docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 900
          docker compose -f docker-compose.prod.yml ps

          # Remove superseded images to save space on the server
          docker image prune -f
          EOF
